<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Localpane Lab Kit cover: original artwork, Localpane palette (accent #3b5bdb / #7b93ff on #0f1115). -->
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#0f1115"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#2b323c" stroke-width="2"/>

  <!-- brand -->
  <rect x="80" y="76" width="56" height="56" rx="12" fill="#3b5bdb"/>
  <text x="108" y="113" class="mono" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">{ }</text>
  <text x="152" y="113" class="sans" font-size="26" font-weight="600" fill="#e6e9ee">Localpane <tspan fill="#9aa4b2" font-weight="400">Lab Kit</tspan></text>

