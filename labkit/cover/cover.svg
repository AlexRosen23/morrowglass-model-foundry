  <text x="80" y="372" class="sans" font-size="56" font-weight="800" fill="#e6e9ee">From Scratch</text>
  <text x="80" y="428" class="sans" font-size="34" font-weight="700" fill="#7b93ff">on Your Laptop</text>
  <text x="80" y="492" class="sans" font-size="25" fill="#9aa4b2">8 steps · starter code · tests for every step · full solution</text>

