# Lab kit settings, sourced by verify.sh and ../scripts/package-labkit.sh (POSIX sh syntax).
# Copied from the QUORUM pilot kit; only the values change between kits.

KIT_SLUG=morrowglass-transformer-labkit   # zip name: dist/$KIT_SLUG-$KIT_VERSION.zip
KIT_VERSION=1.0.0                         # keep in step with CHANGELOG.md
KIT_TITLE="Build a Transformer Language Model From Scratch on Your Laptop"
STEPS=8                                   # steps/step-01 .. steps/step-08

# Marker syntax for tools/labgen.py: the language's line comment, and which files carry markers.
COMMENT='#'
MARKER_EXT='.py'
FORMAT_CMD=''                             # Python needs no formatter pass; stubs keep their indentation

# The Python that runs the tests (needs torch and pytest). verify.sh and package-labkit.sh use $PY.
PY=${PY:-python3}

# Commands run inside one generated tree. $SEL is a pytest -k expression.
# Tests are named test_stepNN_* (graded in step NN) or test_kit_* (provided code; must always pass).
# PYTHONDONTWRITEBYTECODE keeps __pycache__ out of the generated trees.
# "-o addopts=" ignores the -q in pyproject.toml so the output format is fixed.
COMPILE_CMD='PYTHONDONTWRITEBYTECODE=1 "$PY" -m pytest -o addopts= -p no:cacheprovider --collect-only -q >/dev/null'
TEST_CMD='PYTHONDONTWRITEBYTECODE=1 "$PY" -m pytest -o addopts= -p no:cacheprovider -q -rf -k "$SEL"'
COUNT_CMD='PYTHONDONTWRITEBYTECODE=1 "$PY" -m pytest -o addopts= -p no:cacheprovider --collect-only -q -k "$SEL" | grep -c "::"'
LINT_CMD='"$PY" -m ruff check --no-cache .'   # solution only (starters have unreachable code after stubs)

# Files and folders from labkit/ that go into the zip next to steps/ and solution/.
SHIP_FILES="README-FIRST.md WORKBOOK.md LICENSE-LABKIT.md CHANGELOG.md THIRD-PARTY.md check.sh"

# Public-domain practice text, copied at package time from the repository's committed sample
# (data/sample/shakespeare, Project Gutenberg boilerplate already removed). "source:target" pairs,
# source relative to the repository root, target relative to the kit folder in the zip.
DATA_FILES="data/sample/shakespeare/train.txt:data/shakespeare-train.txt data/sample/shakespeare/val.txt:data/shakespeare-val.txt"

# The licence is a template, filled at package time exactly like Localpane's build-packages.mjs fills
# packages/_templates/LICENSE-COMMERCIAL.md: {{LICENSOR}} from "licensor" and {{CONTACT_EMAIL}} from
# "licenceSupportEmail" in Localpane's config/site.config.json, {{YEAR}} from the build date. The
# support address goes ONLY into the licence file in the zip, never into public pages or the repo.
LICENCE_TEMPLATE=LICENSE-LABKIT.md
LOCALPANE_SITE_CONFIG_DEFAULT="$HOME/Desktop/Claude Projects/DevForge/config/site.config.json"
