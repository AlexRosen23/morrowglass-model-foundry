[project]
name = "scratchlm"
version = "1.0.0"
description = "A small decoder-only Transformer language model, built from scratch in PyTorch, step by step."
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
