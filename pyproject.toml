[project]
name = "morrowglass"
version = "0.1.0"
description = "Morrowglass Model Foundry: a reproducible miniature language-model laboratory (scratch PyTorch Transformer, baselines, ablations)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.15.0",
  "numpy==2.5.4",
  "tokenizers==0.22.2",
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
hf = ["transformers==4.57.6", "peft==0.21.2"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "httpx>=0.28", "transformers==4.57.6", "peft==0.21.2"]

[tool.uv.sources]
# Linux CI gets CPU-only wheels (no multi-GB CUDA download); macOS uses the default PyPI wheel (MPS).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
morrowglass = "morrowglass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morrowglass"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E741"]

[tool.ruff.lint.per-file-ignores]
# Report/analysis modules build long human-readable f-strings; tests contain long literal fixtures.
"src/morrowglass/experiments/*.py" = ["E501", "RUF005"]
"src/morrowglass/contracts.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["morrowglass"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer CPU tests (still under ~30 s)"]
